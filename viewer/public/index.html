<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaTeX Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      gap: 1px;
      background: #d1d1d6;
    }

    .panel {
      background: white;
      display: flex;
      flex-direction: column;
    }

    .left-panel {
      flex: 1;
      min-width: 0;
    }

    .right-panel {
      width: 50%;
      min-width: 400px;
    }

    .toolbar {
      background: #fafafa;
      border-bottom: 1px solid #e5e5e7;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding: 8px 16px;
      background: #fafafa;
      border-bottom: 1px solid #e5e5e7;
      flex-shrink: 0;
    }

    .tab {
      padding: 6px 12px;
      border-radius: 6px;
      background: white;
      border: 1px solid #e5e5e7;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab:hover {
      background: #f9f9f9;
    }

    .tab.active {
      background: #007aff;
      color: white;
      border-color: #007aff;
    }

    .editor-container {
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .pdf-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .pdf-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #007aff;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #0051d5;
    }

    button:active {
      background: #004fc4;
    }

    button.secondary {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    button.secondary:hover {
      background: #e8e8ed;
    }

    .status {
      font-size: 13px;
      color: #86868b;
      margin-left: auto;
    }

    .status.error {
      color: #ff3b30;
    }

    .status.success {
      color: #34c759;
    }

    .cm-editor {
      height: 100%;
      font-size: 14px;
    }

    .cm-scroller {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel left-panel">
      <div class="tabs" id="tabs"></div>
      <div class="toolbar">
        <button id="save-btn">Save</button>
        <span class="status" id="save-status"></span>
      </div>
      <div class="editor-container" id="editor"></div>
    </div>

    <div class="panel right-panel">
      <div class="toolbar">
        <button id="compile-btn">Compile</button>
        <button class="secondary" id="download-btn">Download PDF</button>
        <span class="status" id="compile-status"></span>
      </div>
      <div class="pdf-container">
        <iframe id="pdf-viewer" src="/pdf"></iframe>
      </div>
    </div>
  </div>

  <script type="module">
    import { EditorView, basicSetup } from 'https://esm.sh/codemirror';
    import { StreamLanguage } from 'https://esm.sh/@codemirror/language';
    import { stex } from 'https://esm.sh/@codemirror/legacy-modes/mode/stex';

    let files = [];
    let currentFile = null;
    let editorView = null;

    const ws = new WebSocket(`ws://${location.host}`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'file-changed') {
        const file = files.find(f => f.filename === data.filename);
        if (file) {
          file.content = data.content;
          if (currentFile === data.filename) {
            editorView.dispatch({
              changes: {
                from: 0,
                to: editorView.state.doc.length,
                insert: data.content
              }
            });
          }
        }
      } else if (data.type === 'compile-complete') {
        handleCompileResult(data.result);
      }
    };

    async function loadFiles() {
      const response = await fetch('/api/files');
      files = await response.json();
      renderTabs();
      loadFile(files[0].filename);
    }

    function renderTabs() {
      const tabsContainer = document.getElementById('tabs');
      tabsContainer.innerHTML = '';

      files.forEach(file => {
        const tab = document.createElement('div');
        tab.className = 'tab';
        tab.textContent = file.filename;
        tab.onclick = () => loadFile(file.filename);
        tabsContainer.appendChild(tab);
      });

      updateActiveTab();
    }

    function updateActiveTab() {
      document.querySelectorAll('.tab').forEach((tab, index) => {
        tab.classList.toggle('active', files[index].filename === currentFile);
      });
    }

    function loadFile(filename) {
      currentFile = filename;
      const file = files.find(f => f.filename === filename);

      if (editorView) {
        editorView.dispatch({
          changes: {
            from: 0,
            to: editorView.state.doc.length,
            insert: file.content
          }
        });
      } else {
        editorView = new EditorView({
          doc: file.content,
          extensions: [
            basicSetup,
            StreamLanguage.define(stex),
            EditorView.updateListener.of((update) => {
              if (update.docChanged) {
                const file = files.find(f => f.filename === currentFile);
                if (file) {
                  file.content = editorView.state.doc.toString();
                }
              }
            })
          ],
          parent: document.getElementById('editor')
        });

        document.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key === 's') {
            e.preventDefault();
            saveCurrentFile();
          }
        });
      }

      updateActiveTab();
    }

    async function saveCurrentFile() {
      const file = files.find(f => f.filename === currentFile);
      const statusEl = document.getElementById('save-status');

      try {
        const response = await fetch(`/api/save/${currentFile}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content: file.content })
        });

        if (response.ok) {
          statusEl.textContent = 'Saved';
          statusEl.className = 'status success';
          setTimeout(() => {
            statusEl.textContent = '';
            statusEl.className = 'status';
          }, 2000);
        } else {
          throw new Error('Save failed');
        }
      } catch (err) {
        statusEl.textContent = 'Save failed';
        statusEl.className = 'status error';
      }
    }

    async function compile() {
      const btn = document.getElementById('compile-btn');
      const statusEl = document.getElementById('compile-status');

      btn.disabled = true;
      statusEl.textContent = 'Compiling...';
      statusEl.className = 'status';

      try {
        const response = await fetch('/api/compile', { method: 'POST' });
        const result = await response.json();
        handleCompileResult(result);
      } catch (err) {
        statusEl.textContent = 'Compile failed';
        statusEl.className = 'status error';
      } finally {
        btn.disabled = false;
      }
    }

    function handleCompileResult(result) {
      const statusEl = document.getElementById('compile-status');

      if (result.success) {
        statusEl.textContent = `Compiled in ${result.duration}ms`;
        statusEl.className = 'status success';
        refreshPDF();
      } else {
        statusEl.textContent = result.error || 'Compile failed';
        statusEl.className = 'status error';
      }
    }

    function refreshPDF() {
      const iframe = document.getElementById('pdf-viewer');
      iframe.src = `/pdf?t=${Date.now()}`;
    }

    function downloadPDF() {
      window.open('/pdf', '_blank');
    }

    document.getElementById('save-btn').onclick = saveCurrentFile;
    document.getElementById('compile-btn').onclick = compile;
    document.getElementById('download-btn').onclick = downloadPDF;

    loadFiles();
  </script>
</body>
</html>
